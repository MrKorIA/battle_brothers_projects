<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BB Sprite Editor</title>
<script>
// i18n: реестр языков; словари — в assets/lang_*.js (должны грузиться ДО основного скрипта)
var LANGS = {}, LANG_CODE = "ru", LANG = null;
function registerLang(code, dict) { LANGS[code] = dict; }
function t(key, params) {
  var s = (LANG && LANG[key]) || key;
  if (params) for (var k in params) s = s.split("{" + k + "}").join(params[k]);
  return s;
}
try { LANG_CODE = localStorage.getItem("bbse_lang") || "en"; } catch (e) {}
</script>
<script src="assets/lang_ru.js"></script>
<script src="assets/lang_en.js"></script>
<style>
  :root { --bg:#2b2b2b; --panel:#383838; --border:#4a4a4a; --text:#ddd; --accent:#c9a227; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 Segoe UI, Arial, sans-serif;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #toolbar { display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--panel);
             border-bottom:1px solid var(--border); flex:0 0 auto; flex-wrap:wrap; }
  #main { display:flex; flex:1; min-height:0; }
  #left { width:280px; flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border);
          display:flex; flex-direction:column; min-height:0; }
  #right { width:300px; flex:0 0 auto; background:var(--panel); border-left:1px solid var(--border);
           display:flex; flex-direction:column; min-height:0; }
  #stageWrap { flex:1; min-width:0; position:relative; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  .panel-h { padding:6px 10px; font-weight:bold; border-bottom:1px solid var(--border); flex:0 0 auto; }
  .scroll { overflow-y:auto; flex:1; min-height:0; }
  button { background:#4a4a4a; color:var(--text); border:1px solid #5a5a5a; padding:3px 10px;
           cursor:pointer; border-radius:3px; font-size:12px; }
  button:hover { background:#5a5a5a; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); color:#222; border-color:var(--accent); font-weight:bold; }
  input[type=text], input[type=number] { background:#222; color:var(--text); border:1px solid var(--border);
           padding:3px 6px; border-radius:3px; font-size:12px; width:100%; }
  input[type=number] { width:58px; }
  .sprite-item { padding:3px 10px; cursor:pointer; white-space:nowrap; overflow:hidden;
                 text-overflow:ellipsis; }
  .sprite-item:hover { background:#444; }
  .sprite-item .dir { color:#888; font-size:11px; }
  .stage-item { padding:4px 10px; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .stage-item.sel { background:#4d4d2a; }
  .stage-item:hover { background:#444; }
  .stage-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stage-item button { padding:0 5px; font-size:11px; }
  .props { padding:8px 10px; display:grid; grid-template-columns:auto 1fr auto; gap:5px 8px;
           align-items:center; border-bottom:1px solid var(--border); }
  .props label { color:#aaa; }
  .row { display:flex; gap:6px; align-items:center; }
  #status { color:#aaa; padding:6px 10px; border-top:1px solid var(--border); flex:0 0 auto;
            white-space:pre-wrap; }
  #hint { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.55); padding:6px 10px;
          border-radius:4px; pointer-events:none; font-size:12px; max-width:60%; }
  .drop-active::after { content:var(--drop-text, "Drop to load"); position:absolute; inset:0;
          background:rgba(201,162,39,.15); border:3px dashed var(--accent); display:flex;
          align-items:center; justify-content:center; font-size:20px; color:var(--accent);
          pointer-events:none; z-index:10; }
  a { color:var(--accent); }
  .modified { color:var(--accent); }
</style>
</head>
<body>
<div id="toolbar">
  <b>BB Sprite Editor</b>
  <button id="btnOpenPng" data-i18n="btn_open" data-i18n-tt="tt_open" title="">Открыть PNG…</button>
  <label style="display:flex;gap:4px;align-items:center;user-select:none" data-i18n-tt="tt_doll" title="">
    <input type="checkbox" id="chkDoll"><span data-i18n="chk_doll">кукла</span></label>
  <label style="display:flex;gap:4px;align-items:center;user-select:none" data-i18n-tt="tt_dead" title="">
    <input type="checkbox" id="chkDollDead"><span data-i18n="chk_dead">труп</span></label>
  <label style="display:flex;gap:4px;align-items:center;user-select:none" data-i18n-tt="tt_tile" title="">
    <input type="checkbox" id="chkTile"><span data-i18n="chk_tile">тайл</span></label>
  <span id="brushInfo" style="color:#aaa" data-i18n="not_loaded">не загружено</span>
  <span style="flex:1"></span>
  <select id="selLang" title="language / язык" style="background:#4a4a4a;color:var(--text);border:1px solid #5a5a5a;border-radius:3px;padding:2px">
    <option value="ru">RU</option><option value="en">EN</option>
  </select>
  <button id="btnSave" class="primary" disabled data-i18n="btn_save">Сохранить</button>
  <button id="btnDownload" disabled data-i18n="btn_download">Скачать XML</button>
  <button id="btnHelp">?</button>
</div>
<div id="main">
  <div id="left">
    <div class="panel-h" data-i18n="hdr_sprites">Спрайты кисти</div>
    <div style="padding:6px 10px; flex:0 0 auto;"><input type="text" id="filter" data-i18n-ph="filter_ph" placeholder="фильтр…"></div>
    <div class="scroll" id="spriteList"><div style="padding:10px;color:#888" data-i18n="empty_list">Откройте спрайт кнопкой «Открыть PNG…» или перетащите сюда PNG + metadata.xml.</div></div>
  </div>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="hint" data-i18n="hint">Клик — выбрать спрайт · Drag — двигать</div>
  </div>
  <div id="right">
    <div class="panel-h" data-i18n="hdr_scene">Сцена (кукла)</div>
    <div class="scroll" id="stageList" style="flex:0 0 auto; max-height:30%"></div>
    <div class="panel-h" style="border-top:1px solid var(--border)" data-i18n="hdr_props">Свойства</div>
    <div class="scroll" id="props"><div style="padding:10px;color:#888" data-i18n="no_selection">Спрайт не выбран</div></div>
    <div id="status"></div>
  </div>
</div>

<script>
"use strict";
/* ================= Модель ================= */
const COORD_ATTRS = ["left","right","top","bottom","offsetX","offsetY"];
let brushes = [];              // загруженные кисти: {key,name,xmlFh,xmlText,sprites,byId,dirty,fromDrop,shift}
let sprites = [];              // ОТКРЫТЫЕ спрайты (левая панель) — только то, что загрузил пользователь
let pngMap = new Map();        // spriteId -> кисть (привязка из «Открыть PNG…»)
let stage = [];                // спрайты на сцене: {spr, visible, opacity, orig, part}
let selected = null;
let dropFiles = new Map();     // путь в нижнем регистре -> File (drag&drop fallback)
let images = new Map();        // brushKey|id -> HTMLImageElement | Promise | "error"
let lastDrawOrder = [];        // индексы stage в порядке отрисовки (для hit-test)
let brushSeq = 0;

/* Базовые куклы: bust_naked_body_00 + bust_head_02 (entity_0), живые и _dead.
   Мировые координаты (y вверх, offset аддитивно). У naked_body_00 в brush нет left/right —
   центрировано по ширине PNG. Ассеты лежат рядом: tools/assets/. */
const DOLL_SETS = {
  live: [
    { src: "assets/doll_body.png", l: -39, r: 39, t: -13, b: 45 },
    { src: "assets/doll_head.png", l: -22, r: 32, t: 13,  b: 83 },
  ],
  dead: [
    { src: "assets/doll_body_dead.png", l: -59, r: 72, t: -47, b: 63 },
    { src: "assets/doll_head_dead.png", l: -39, r: 21, t: -49, b: 11 },
  ],
};
for (const k in DOLL_SETS)
  DOLL_SETS[k].forEach(d => { d.img = new Image(); d.img.src = d.src; });
// кукла для статичных объектов: тайл (grass_01) центрируется на pivot; объекты anchor'ятся
// в центре тайла — спрайты object_1 ложатся без подгонки.
const TILE_IMG = new Image(); TILE_IMG.src = "assets/tile_grass.png";

/* ================= Загрузка ================= */
const $ = id => document.getElementById(id);
const status = m => { $("status").textContent = m; };
// i18n: активный язык + статика + переключатель
LANG = LANGS[LANG_CODE] || LANGS.ru;
document.title = t("app_title");
(function applyStaticLang() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-tt]").forEach(el => { el.title = t(el.dataset.i18nTt); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.documentElement.style.setProperty("--drop-text", '"' + t("drop_hint") + '"');
  document.documentElement.lang = LANG_CODE;
})();
$("selLang").value = LANG_CODE;
$("selLang").onchange = () => {
  try { localStorage.setItem("bbse_lang", $("selLang").value); } catch (e) {}
  location.reload();
};

function normPath(p) { return p.replace(/\\/g, "/").replace(/^\.?\//, "").toLowerCase(); }

function parseBrush(text, xmlFh, fromDrop) {
  const brush = { key: "b" + (brushSeq++), name: "brush", xmlFh: xmlFh || null, xmlText: text,
                  sprites: [], byId: new Map(), imgByBase: new Map(), dirty: new Set(), fromDrop: !!fromDrop };
  const m0 = text.slice(0, 200).match(/<brush name="([^"]+)"/);
  if (m0) brush.name = m0[1].replace(/^gfx\//, "").replace(/\.png$/, "");
  const re = /<sprite\s+([^>]*?)\/>/g;
  let m;
  while ((m = re.exec(text))) {
    const attrs = {};
    const are = /([\w-]+)="([^"]*)"/g;
    let a;
    while ((a = are.exec(m[1]))) attrs[a[1]] = a[2];
    if (!attrs.id) continue;
    const spr = { id: attrs.id, attrs, img: attrs.img || "", present: new Set(Object.keys(attrs)), _brush: brush };
    for (const c of COORD_ATTRS) if (!(c in attrs)) attrs[c] = "0";
    brush.sprites.push(spr);
    if (!brush.byId.has(spr.id)) brush.byId.set(spr.id, spr);
    // привязка PNG->спрайт по ИМЕНИ ФАЙЛА картинки (id может не совпадать с именем файла!)
    const base = normPath(spr.img).split("/").pop();
    if (base && !brush.imgByBase.has(base)) brush.imgByBase.set(base, spr);
    // дубли координатных атрибутов (последствия старого бага с дописыванием) — помечаем:
    // одно сохранение пересоберёт тег и почистит файл
    for (const c of COORD_ATTRS)
      if (m[0].split(" " + c + "=\"").length - 1 > 1) { brush.dirty.add(spr.id); brush.dupCount = (brush.dupCount || 0) + 1; break; }
  }
  brushes.push(brush);
  $("btnSave").disabled = $("btnDownload").disabled = false;
  return brush;
}
function totalDirty() { let n = 0; for (const b of brushes) n += b.dirty.size; return n; }
// открыть спрайт в левой панели (показываем только то, что пользователь открыл)
function openSprite(spr, blob) {
  if (blob && !images.has(spr._brush.key + "|" + spr.id)) {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { // размеры PNG нужны, чтобы вывести отсутствующие края rect'а
      spr._pngW = img.naturalWidth; spr._pngH = img.naturalHeight;
      scheduleRedraw();
    };
    img.src = url;
    images.set(spr._brush.key + "|" + spr.id, img);
  }
  if (!sprites.includes(spr)) { sprites.push(spr); renderSpriteList(); }
}

/* ---------- открытие по одному PNG + его XML, без папок ----------
   1-й диалог: PNG. 2-й диалог: XML кисти (metadata.xml) — хендл файла даёт и координаты,
   и запись при сохранении. Картинки спрайтов — из выбранных PNG. Левая панель показывает
   ТОЛЬКО открытое. Привязка png→кисть в pngMap по ИМЕНИ ФАЙЛА картинки (не по id спрайта —
   id в brush может не совпадать с именем файла, резолв идёт через img). */
// есть ли в тексте xml спрайт с картинкой basename?
function textHasImg(text, pngBase) {
  const re = /img="([^"]*)"/g;
  let m;
  while ((m = re.exec(text))) if (normPath(m[1]).split("/").pop() === pngBase) return true;
  return false;
}
// подтянуть СВЕЖИЙ xml кисти с диска (объекты спрайтов обновляются на месте — stage не ломается).
// Защита: если в редакторе есть несохранённые правки по кисти — свежее НЕ подтягиваем.
async function refreshBrushFromDisk(brush) {
  if (!brush.xmlFh) return;
  let text;
  try { text = await (await brush.xmlFh.getFile()).text(); } catch (e) { return; }
  if (text === brush.xmlText) return;
  if (brush.dirty.size) {
    status(t("st_dirty_refresh", { name: brush.name }));
    return;
  }
  const seen = new Set();
  const re = /<sprite\s+([^>]*?)\/>/g;
  let m;
  while ((m = re.exec(text))) {
    const attrs = {};
    const are = /([\w-]+)="([^"]*)"/g;
    let a;
    while ((a = are.exec(m[1]))) attrs[a[1]] = a[2];
    if (!attrs.id || seen.has(attrs.id)) continue;
    seen.add(attrs.id);
    let spr = brush.byId.get(attrs.id);
    if (!spr) {
      spr = { id: attrs.id, attrs, img: attrs.img || "", present: new Set(Object.keys(attrs)), _brush: brush };
      brush.sprites.push(spr);
      brush.byId.set(attrs.id, spr);
    } else {
      spr.attrs = attrs;
      spr.img = attrs.img || "";
      spr.present = new Set(Object.keys(attrs));
    }
    for (const c of COORD_ATTRS) if (!(c in attrs)) attrs[c] = "0";
  }
  for (const [id, spr] of brush.byId) if (!seen.has(id)) brush.byId.delete(id);
  // перестроить привязку PNG->спрайт по имени файла картинки
  brush.imgByBase.clear();
  for (const spr of brush.byId.values()) {
    const base = normPath(spr.img).split("/").pop();
    if (base && !brush.imgByBase.has(base)) brush.imgByBase.set(base, spr);
  }
  brush.xmlText = text;
  for (const it of stage) if (it.spr._brush === brush) it.orig = null; // переснимем снапшоты
}
// последняя точка файловых диалогов в рамках сессии (startIn — папка последнего выбора)
let lastPickerLoc = null;
async function pickFile(types) {
  try {
    const [fh] = await showOpenFilePicker(lastPickerLoc ? { types, startIn: lastPickerLoc } : { types });
    lastPickerLoc = fh;
    return fh;
  } catch (e) {
    if (e && e.name === "AbortError") return null; // пользователь отменил
    if (!lastPickerLoc) return null;
    try {
      const [fh] = await showOpenFilePicker({ types }); // fallback без startIn
      lastPickerLoc = fh;
      return fh;
    } catch (e2) { return null; } // отмена и повторная ошибка — без диалога дальше
  }
}

async function openPng() {
  if (!window.showOpenFilePicker) {
    status(t("err_no_chrome")); return;
  }
  const pngFh = await pickFile([{ description: "PNG", accept: { "image/png": [".png"] } }]);
  if (!pngFh) return; // отмена
  const pngBase = normPath(pngFh.name); // ключ привязки — ИМЯ ФАЙЛА картинки
  let brush = pngMap.get(pngBase) || null;
  if (!brush) for (const b of brushes) if (b.imgByBase.has(pngBase)) { brush = b; break; }
  if (brush) { pngMap.set(pngBase, brush); await refreshBrushFromDisk(brush); } // свежие данные xml
  if (!brush) {
    const xmlFh = await pickFile([{ description: "Brush XML", accept: { "text/xml": [".xml"] } }]);
    if (!xmlFh) return; // отмена
    // тот же xml-файл уже загружен? — тогда это та же кисть
    brush = null;
    for (const b of brushes) {
      if (!b.xmlFh) continue;
      try { if (await b.xmlFh.isSameEntry(xmlFh)) { brush = b; break; } } catch (e) {}
    }
    if (!brush) {
      const text = await (await xmlFh.getFile()).text();
      if (!textHasImg(text, pngBase)) {
        status(t("err_no_img_in_xml", { file: xmlFh.name, img: pngFh.name }));
        return;
      }
      brush = parseBrush(text, xmlFh, false);
    }
    pngMap.set(pngBase, brush);
  }
  const spr = brush.imgByBase.get(pngBase);
  if (!spr) { status(t("err_sprite_not_found", { img: pngFh.name, name: brush.name })); return; }
  openSprite(spr, await pngFh.getFile());
  addToStage(spr);
}

async function getImage(spr) {
  const key = spr._brush.key + "|" + spr.id;
  if (images.has(key)) return images.get(key);
  if (spr._brush.fromDrop) {
    const f = dropFiles.get(normPath(spr.img)) || dropFiles.get(normPath(spr.img).split("/").pop());
    if (f) { openSprite(spr, f); return images.get(key); }
  }
  return "error";
}

/* Drag & drop */
const stageWrap = $("stageWrap");
window.addEventListener("dragover", e => { e.preventDefault(); stageWrap.classList.add("drop-active"); });
window.addEventListener("dragleave", e => { if (e.target === document) stageWrap.classList.remove("drop-active"); });
window.addEventListener("drop", async e => {
  e.preventDefault(); stageWrap.classList.remove("drop-active");
  const files = [...e.dataTransfer.files];
  let xmlFile = null;
  for (const f of files) {
    const lower = f.name.toLowerCase();
    if ((lower === "metadata.xml" || lower === "sprites.xml") && !xmlFile) xmlFile = f;
  }
  for (const f of files) {
    if (f.type === "image/png" || f.name.toLowerCase().endsWith(".png")) {
      const rel = (f.webkitRelativePath || f.name).replace(/^.*?[\/\\]/, ""); // отрезаем корень, если он есть
      dropFiles.set(normPath(rel), f);
      dropFiles.set(normPath(f.name), f); // и по basename
    }
  }
  if (xmlFile) {
    const text = await xmlFile.text();
    const b = parseBrush(text, null, true);
    $("brushInfo").textContent = t("drop_brushes") + ": " + brushes.map(x => x.name).join(", ");
    // в левую панель — только спрайты, чьи PNG реально есть в dropFiles
    let n = 0;
    for (const spr of b.sprites) {
      const f = dropFiles.get(normPath(spr.img)) || dropFiles.get(normPath(spr.img).split("/").pop());
      if (f) { openSprite(spr, f); pngMap.set(normPath(spr.img).split("/").pop(), b); n++; }
    }
    status(t("drop_sprites_with_imgs", { name: b.name, n: n }));
  } else if (dropFiles.size) {
    status(t("drop_wait_xml", { n: dropFiles.size }));
  }
});
$("btnOpenPng").onclick = openPng;
$("chkDoll").onchange = () => { if ($("chkDoll").checked) { $("chkDollDead").checked = false; $("chkTile").checked = false; } scheduleRedraw(); };
$("chkDollDead").onchange = () => { if ($("chkDollDead").checked) { $("chkDoll").checked = false; $("chkTile").checked = false; } scheduleRedraw(); };
$("chkTile").onchange = () => { if ($("chkTile").checked) { $("chkDoll").checked = false; $("chkDollDead").checked = false; } scheduleRedraw(); };

/* ================= Список спрайтов кисти ================= */
function renderSpriteList() {
  const q = $("filter").value.toLowerCase();
  const el = $("spriteList");
  el.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const spr of sprites) {
    if (q && !spr.id.toLowerCase().includes(q) && !spr.img.toLowerCase().includes(q)) continue;
    const d = document.createElement("div");
    d.className = "sprite-item";
    const dir = spr.img.replace(/\\/g, "/").split("/").slice(0, -1).join("/");
    d.innerHTML = '<span class="dir">[' + escapeHtml(spr._brush.name) + '] ' + (dir ? dir + "/ " : "") + "</span>" + escapeHtml(spr.id);
    d.title = spr._brush.name + " · " + spr.id + "  (" + spr.attrs.width + "x" + spr.attrs.height + ")";
    d.onclick = async () => { await refreshBrushFromDisk(spr._brush); addToStage(spr); };
    frag.appendChild(d);
  }
  el.appendChild(frag);
}
$("filter").oninput = renderSpriteList;
function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ================= Сцена ================= */
// автоопределение типа детали (в моддах по пути/имени не всегда понятно — можно сменить в свойствах)
function guessPart(spr) {
  const s = (spr.id + "|" + spr.img).toLowerCase();
  if (s.includes("upgrade") || s.includes("armor_up")) return "armor_up"; // раньше armor!
  if (s.includes("helmet")) return "helmet";
  if (s.includes("weapon")) return "weapon";
  if (s.includes("armor") || s.includes("armour")) return "armor";
  return "";
}
const PART_NAMES = { "": t("part_none"), helmet: t("part_helmet"), armor: t("part_armor"), armor_up: t("part_up"), weapon: t("part_weapon") };

function addToStage(spr) {
  if (!spr || stage.some(s => s.spr === spr)) return;
  stage.push({ spr, visible: true, opacity: 1, orig: null, part: guessPart(spr) });
  renderStageList(); scheduleRedraw();
}
function removeFromStage(i) { stage.splice(i, 1); if (selected === i) selected = null; else if (selected > i) selected--; renderStageList(); scheduleRedraw(); renderProps(); }
function moveStage(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= stage.length) return;
  [stage[i], stage[j]] = [stage[j], stage[i]];
  selected = j; renderStageList(); scheduleRedraw();
}
function renderStageList() {
  const el = $("stageList");
  el.innerHTML = "";

  if (Math.abs(sx - x1) <= EDGE_TOL && sy >= y1 - EDGE_TOL && sy <= y2 + EDGE_TOL) edges.left = true;

}
async function save() {
  const dirtyBrushes = brushes.filter(b => b.dirty.size);
  if (!dirtyBrushes.length) return;
  let saved = [], downloaded = [];
  for (const b of dirtyBrushes) {
    const text = buildXml(b);
    if (b.xmlFh) {
      try {
        if (await b.xmlFh.queryPermission({ mode: "readwrite" }) !== "granted")
          await b.xmlFh.requestPermission({ mode: "readwrite" });
        const w = await b.xmlFh.createWritable();
        await w.write(text); await w.close();
        b.xmlText = text; b.dirty.clear(); saved.push(b.name);
        continue;
      } catch (e) { status(t("err_write", { name: b.name, msg: e.message })); }
    }
    downloadXml(text, "metadata_" + b.name + ".xml");
    b.xmlText = text; b.dirty.clear(); downloaded.push(b.name);
  }
  renderStageList(); updateSaveState();
  if (saved.length)
    status(t("st_saved_disk", { names: saved.join(", ") }));
  else if (downloaded.length)
    status(t("st_saved_download", { names: downloaded.join(", ") }));
}
function downloadXml(text, name) {
  const blob = new Blob([text], { type: "text/xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name || "metadata.xml";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("btnSave").onclick = save;
$("btnDownload").onclick = () => {
  for (const b of brushes) if (b.dirty.size) downloadXml(buildXml(b), "metadata_" + b.name + ".xml");
};
$("btnHelp").onclick = () => alert(t("help"));
</script>
